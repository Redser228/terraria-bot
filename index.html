<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Realm: Terraria Edition</title>
    <script src="https://telegram.org/Superraria_Bot.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #0d1117; font-family: 'Courier New', monospace;
            color: white; touch-action: none;
        }
        canvas {
            display: block;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Интерфейс в стиле Terraria */
        #ui {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; pointer-events: none;
        }
        .panel {
            background: rgba(24, 28, 52, 0.88);
            border: 2px solid #7986cb;
            box-shadow: inset 0 0 0 2px #1a1d36, 0 4px 0 rgba(0,0,0,0.4);
            padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }
        #hotbar {
            position: absolute; top: 56px; left: 10px; display: flex; gap: 6px;
        }
        .slot {
            width: 46px; height: 46px;
            background: rgba(24, 28, 52, 0.88);
            border: 2px solid #5c6bc0;
            box-shadow: inset 0 0 0 2px #1a1d36, 0 3px 0 rgba(0,0,0,0.4);
            border-radius: 6px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; cursor: pointer; text-shadow: 1px 1px 0 #000;
        }
        .slot.active {
            border-color: #ffd54f;
            background: rgba(63, 81, 181, 0.92);
            transform: translateY(-2px);
        }

        /* Сюжетное диалоговое окно */
        #dialog {
            position: absolute; bottom: 110px; left: 15px; right: 15px;
            background: rgba(18, 22, 42, 0.96);
            border: 3px solid #ffd54f;
            box-shadow: inset 0 0 0 2px #12162a, 0 6px 0 rgba(0,0,0,0.5);
            border-radius: 8px; padding: 14px; display: none;
        }
        #dialog-title { color: #ffd54f; font-weight: bold; margin-bottom: 6px; text-shadow: 1px 1px 0 #000; }
        #dialog-text { font-size: 13px; line-height: 1.45; margin-bottom: 12px; color: #eceff1; }
        #dialog-btn {
            background: #ffd54f; color: #1a1d36; border: 2px solid #ffb300; padding: 6px 16px;
            font-weight: bold; border-radius: 4px; cursor: pointer; font-family: inherit;
        }

        /* Сенсорное управление */
        #controls {
            position: absolute; bottom: 16px; left: 16px; right: 16px;
            display: flex; justify-content: space-between; pointer-events: none;
        }
        .ctrl-group { display: flex; gap: 12px; pointer-events: auto; }
        .btn {
            width: 56px; height: 56px;
            background: rgba(24, 28, 52, 0.65);
            border: 2px solid rgba(159, 168, 218, 0.6);
            box-shadow: 0 4px 0 rgba(0,0,0,0.4);
            border-radius: 12px;
            color: white; font-size: 20px; display: flex; align-items: center; justify-content: center;
            text-shadow: 1px 1px 0 #000;
        }
        .btn:active { background: rgba(255, 213, 79, 0.45); border-color: #ffd54f; transform: translateY(2px); }

        #err-box {
            position: fixed; top: 115px; left: 10px; right: 10px;
            background: rgba(183, 28, 28, 0.92); border: 2px solid #ff8a80;
            padding: 8px 10px; border-radius: 6px; font-size: 11px;
            display: none; z-index: 999; word-break: break-word;
        }
    </style>
</head>
<body>

<canvas id="game"></canvas>
<div id="err-box"></div>

<div id="ui">
    <div class="panel">❤️ <span id="hp">100</span> | 💎 <span id="ore">0</span></div>
    <div class="panel" id="quest-box">Квест: Поговори с Гидом</div>
</div>

<div id="hotbar">
    <div class="slot active" onclick="selectTool(0)" id="slot-0">⛏️<br>Кирка</div>
    <div class="slot" onclick="selectTool(1)" id="slot-1">🟫<br><span id="inv-dirt">10</span></div>
    <div class="slot" onclick="selectTool(2)" id="slot-2">⚔️<br>Меч</div>
</div>

<div id="dialog">
    <div id="dialog-title">🧙‍♂️ Старый Гид</div>
    <div id="dialog-text">Приветствую в этих землях! Ночью здесь опасно. Спустись под землю, добудь 5 кристаллов древней руды (синие блоки), чтобы сковать клинок и одолеть Слизня-Стража!</div>
    <button id="dialog-btn" onclick="closeDialog()">Принять задание</button>
</div>

<div id="controls">
    <div class="ctrl-group">
        <div class="btn" id="btn-left">◀</div>
        <div class="btn" id="btn-right">▶</div>
    </div>
    <div class="ctrl-group">
        <div class="btn" id="btn-action">⚔️</div>
        <div class="btn" id="btn-jump">▲</div>
    </div>
</div>

<script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
        try { tg.expand(); } catch (_) {}
    }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = Math.max(1, window.innerWidth || 360);
        canvas.height = Math.max(1, window.innerHeight || 640);
        ctx.imageSmoothingEnabled = false;
    }
    window.addEventListener('resize', resize);
    resize();

    const TILE = 32;
    const COLS = 60;
    const ROWS = 40;
    const GRAVITY = 0.5;

    let world = [];
    let selectedTool = 0;
    let questStage = 0;
    let tick = 0;

    // ==========================================
    // ГЕНЕРАТОР ЧЕТКИХ ПИКСЕЛЬНЫХ ТЕКСТУР (16x16)
    // ==========================================
    const tileSprites = {};

    function createPixelSprite(drawFn) {
        const c = document.createElement('canvas');
        c.width = 16;
        c.height = 16;
        const g = c.getContext('2d');
        g.imageSmoothingEnabled = false;
        drawFn(g);
        return c;
    }

    function drawStoneBase(g) {
        g.fillStyle = '#546e7a'; g.fillRect(0, 0, 16, 16);
        g.fillStyle = '#607d8b'; g.fillRect(1, 1, 14, 14);
        g.fillStyle = '#78909c';
        g.fillRect(1, 1, 6, 2); g.fillRect(9, 7, 5, 2); g.fillRect(2, 11, 5, 2);
        g.fillStyle = '#37474f';
        g.fillRect(0, 5, 8, 1); g.fillRect(7, 6, 1, 4);
        g.fillRect(6, 10, 9, 1); g.fillRect(12, 1, 1, 4);
        g.fillStyle = '#263238';
        g.fillRect(3, 5, 3, 1); g.fillRect(9, 10, 4, 1);
    }

    function initTextures() {
        tileSprites[1] = createPixelSprite(g => {
            g.fillStyle = '#5d3a24'; g.fillRect(0, 0, 16, 16);
            g.fillStyle = '#472b1a';
            [[2,6],[5,9],[11,7],[13,12],[3,13],[8,11],[10,14]].forEach(([x,y]) => g.fillRect(x,y,2,2));
            g.fillStyle = '#73492e';
            [[1,9],[7,6],[12,9],[5,14]].forEach(([x,y]) => g.fillRect(x,y,2,1));
            g.fillStyle = '#2e7d32'; g.fillRect(0, 0, 16, 4);
            g.fillStyle = '#43a047'; g.fillRect(0, 0, 16, 3);
            g.fillStyle = '#66bb6a'; g.fillRect(0, 0, 16, 1);
            g.fillStyle = '#2e7d32';
            [1, 4, 7, 10, 14].forEach((x, i) => g.fillRect(x, 4, 1, (i % 2) + 1));
            g.fillStyle = '#1b5e20';
            [2, 8, 12].forEach(x => g.fillRect(x, 4, 1, 2));
        });

        tileSprites[2] = createPixelSprite(g => {
            g.fillStyle = '#5d3a24'; g.fillRect(0, 0, 16, 16);
            g.fillStyle = '#472b1a';
            [[1,2],[6,1],[12,3],[3,7],[9,6],[14,8],[2,12],[7,13],[12,12]].forEach(([x,y]) => g.fillRect(x,y,2,2));
            g.fillStyle = '#73492e';
            [[4,3],[10,2],[1,9],[7,10],[13,14],[5,15]].forEach(([x,y]) => g.fillRect(x,y,2,1));
            g.fillStyle = '#78909c'; g.fillRect(11, 10, 2, 1); g.fillRect(4, 5, 1, 1);
        });

        tileSprites[3] = createPixelSprite(g => {
            drawStoneBase(g);
        });

        tileSprites[4] = createPixelSprite(g => {
            drawStoneBase(g);
            g.fillStyle = '#004d40';
            g.fillRect(2, 2, 5, 5); g.fillRect(9, 8, 5, 5); g.fillRect(3, 10, 4, 4);
            g.fillStyle = '#00bcd4';
            g.fillRect(3, 3, 3, 3); g.fillRect(10, 9, 3, 3); g.fillRect(4, 11, 2, 2);
            g.fillStyle = '#e0f7fa';
            g.fillRect(3, 3, 1, 1); g.fillRect(10, 9, 1, 1);
        });

        tileSprites[5] = createPixelSprite(g => {
            g.fillStyle = '#4e342e'; g.fillRect(3, 0, 10, 16);
            g.fillStyle = '#6d4c41'; g.fillRect(4, 0, 8, 16);
            g.fillStyle = '#8d6e63'; g.fillRect(5, 0, 2, 16); g.fillRect(9, 2, 1, 12);
            g.fillStyle = '#3e2723';
            g.fillRect(3, 0, 1, 16); g.fillRect(12, 0, 1, 16);
            g.fillRect(7, 3, 1, 5); g.fillRect(10, 9, 1, 5);
        });

        tileSprites[6] = createPixelSprite(g => {
            g.fillStyle = '#1b5e20'; g.fillRect(1, 1, 14, 14);
            g.fillStyle = '#2e7d32'; g.fillRect(0, 2, 16, 12); g.fillRect(2, 0, 12, 16);
            g.fillStyle = '#43a047';
            g.fillRect(2, 2, 5, 4); g.fillRect(8, 3, 5, 4); g.fillRect(4, 8, 6, 4);
            g.fillStyle = '#66bb6a';
            g.fillRect(3, 2, 3, 2); g.fillRect(9, 3, 2, 2);
        });
    }

    const player = {
        x: 10 * TILE, y: 10 * TILE, w: 22, h: 42,
        vx: 0, vy: 0, speed: 4, jump: -9.5,
        grounded: false, facing: 1, hp: 100,
        dirt: 10, ore: 0, attackCooldown: 0
    };

    const guide = { x: 13 * TILE, y: 10 * TILE, w: 22, h: 42, facing: -1, vy: 0 };
    let enemies = [
        { x: 25 * TILE, y: 10 * TILE, w: 30, h: 22, vx: -1.5, vy: 0, hp: 50, maxHp: 50, boss: false },
        { x: 45 * TILE, y: 10 * TILE, w: 52, h: 40, vx: -1, vy: 0, hp: 150, maxHp: 150, boss: true }
    ];

    const clouds = Array.from({ length: 12 }, (_, i) => ({
        x: i * 190 + Math.random() * 80,
        y: 35 + (i % 4) * 32,
        w: 70 + (i % 3) * 30,
        speed: 0.15 + (i % 3) * 0.08
    }));

    function generateWorld() {
        for (let y = 0; y < ROWS; y++) {
            world[y] = [];
            for (let x = 0; x < COLS; x++) {
                let surface = 14 + Math.floor(Math.sin(x * 0.2) * 2);
                if (y < surface) world[y][x] = 0;
                else if (y === surface) world[y][x] = 1;
                else if (y < surface + 5) world[y][x] = 2;
                else {
                    if (Math.random() < 0.15) world[y][x] = 0;
                    else if (Math.random() < 0.08) world[y][x] = 4;
                    else world[y][x] = 3;
                }
            }
        }
        for (let x = 4; x < COLS - 4; x += 7) {
            let sy = 14 + Math.floor(Math.sin(x * 0.2) * 2);
            world[sy - 1][x] = 5; world[sy - 2][x] = 5; world[sy - 3][x] = 5;
            world[sy - 4][x] = 6; world[sy - 4][x - 1] = 6; world[sy - 4][x + 1] = 6;
            world[sy - 5][x] = 6;
        }
    }

    function drawBackground(camX, camY) {
        const w = canvas.width;
        const h = canvas.height;

        const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
        skyGrad.addColorStop(0, '#1e88e5');
        skyGrad.addColorStop(0.55, '#64b5f6');
        skyGrad.addColorStop(1, '#bbdefb');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, w, h);

        const sunX = Math.floor(w * 0.78 - camX * 0.02);
        const sunY = Math.floor(75 - camY * 0.02);
        ctx.fillStyle = 'rgba(255, 238, 88, 0.25)';
        ctx.fillRect(sunX - 10, sunY - 10, 56, 56);
        ctx.fillStyle = '#ffee58';
        ctx.fillRect(sunX, sunY, 36, 36);
        ctx.fillStyle = '#fff9c4';
        ctx.fillRect(sunX + 6, sunY + 6, 24, 24);

        clouds.forEach(c => {
            c.x += c.speed;
            if (c.x > COLS * TILE) c.x = -150;
            const cx = Math.floor(c.x - camX * 0.15);
            const cy = Math.floor(c.y - camY * 0.05);
            ctx.fillStyle = 'rgba(227, 242, 253, 0.85)';
            ctx.fillRect(cx, cy + 8, c.w, 12);
            ctx.fillRect(cx + 10, cy, c.w - 24, 10);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(cx + 12, cy + 2, c.w - 28, 6);
        });

        for (let i = -1; i < 8; i++) {
            const mx = Math.floor(i * 220 - (camX * 0.25) % 220);
            const my = Math.floor(h * 0.58 - camY * 0.15);
            for (let step = 0; step < 12; step++) {
                ctx.fillStyle = step < 3 ? '#e3f2fd' : '#5472d3';
                ctx.fillRect(mx + 110 - step * 10, my + step * 12, step * 20, 12);
            }
        }

        for (let i = -1; i < 10; i++) {
            const hx = Math.floor(i * 160 - (camX * 0.45) % 160);
            const hy = Math.floor(h * 0.68 - camY * 0.25);
            ctx.fillStyle = '#2e7d32';
            ctx.fillRect(hx, hy, 162, h);
            ctx.fillStyle = '#388e3c';
            ctx.fillRect(hx + 20, hy - 16, 120, 16);
            ctx.fillStyle = '#43a047';
            ctx.fillRect(hx + 45, hy - 28, 70, 12);
        }

        const undergroundY = Math.floor(15 * TILE - camY);
        if (undergroundY < h) {
            ctx.fillStyle = '#261811';
            ctx.fillRect(0, Math.max(0, undergroundY), w, h);
            ctx.fillStyle = '#1c110c';
            const startX = -Math.floor((camX * 0.8) % 32);
            for (let by = Math.max(0, undergroundY); by < h; by += 32) {
                for (let bx = startX; bx < w; bx += 32) {
                    ctx.fillRect(bx + 4, by + 4, 12, 8);
                    ctx.fillRect(bx + 18, by + 18, 10, 10);
                }
            }
        }
    }

    function drawCharacter(ent, isGuide) {
        const px = Math.floor(ent.x);
        const py = Math.floor(ent.y);
        const dir = ent.facing || 1;
        const step = !isGuide && Math.abs(ent.vx) > 0.1 ? Math.sin(tick * 0.35) * 3 : 0;

        ctx.fillStyle = '#111111';
        ctx.fillRect(px + 2, py - 2, 18, 44);

        ctx.fillStyle = isGuide ? '#cfd8dc' : '#4e342e';
        ctx.fillRect(px + 3, py, 16, 7);
        ctx.fillRect(dir === 1 ? px + 2 : px + 16, py + 4, 4, 8);

        ctx.fillStyle = '#ffccbc';
        ctx.fillRect(px + 4, py + 6, 14, 12);
        ctx.fillStyle = '#e6a18c';
        ctx.fillRect(px + 4, py + 15, 14, 3);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(dir === 1 ? px + 12 : px + 6, py + 9, 4, 4);
        ctx.fillStyle = isGuide ? '#1565c0' : '#212121';
        ctx.fillRect(dir === 1 ? px + 14 : px + 6, py + 10, 2, 3);

        ctx.fillStyle = isGuide ? '#6d4c41' : '#d32f2f';
        ctx.fillRect(px + 3, py + 18, 16, 14);
        ctx.fillStyle = '#3e2723';
        ctx.fillRect(px + 3, py + 28, 16, 3);
        ctx.fillStyle = '#ffd54f';
        ctx.fillRect(px + 9, py + 28, 4, 3);

        ctx.fillStyle = '#ffccbc';
        ctx.fillRect(px + 8, py + 20, 6, 9);

        ctx.fillStyle = isGuide ? '#4e342e' : '#1a237e';
        ctx.fillRect(px + 4, py + 31, 6, 9 + step);
        ctx.fillRect(px + 12, py + 31, 6, 9 - step);

        ctx.fillStyle = '#212121';
        ctx.fillRect(px + 4, py + 39 + step, 6, 3);
        ctx.fillRect(px + 12, py + 39 - step, 6, 3);

        if (!isGuide) {
            const handX = dir === 1 ? px + 14 : px - 10;
            const handY = py + 18;
            if (selectedTool === 0) {
                ctx.fillStyle = '#795548';
                ctx.fillRect(dir === 1 ? handX : handX + 8, handY - 4, 3, 14);
                ctx.fillStyle = '#90a4ae';
                ctx.fillRect(handX - 3, handY - 6, 16, 3);
            } else if (selectedTool === 2) {
                const isUpgraded = questStage >= 2;
                ctx.fillStyle = isUpgraded ? '#00e5ff' : '#cfd8dc';
                ctx.fillRect(dir === 1 ? handX + 2 : handX + 6, handY - 12, 4, 18);
                ctx.fillStyle = '#ffd54f';
                ctx.fillRect(handX - 1, handY + 4, 10, 3);
            }
        }
    }

    function drawSlime(en) {
        const sx = Math.floor(en.x);
        const sy = Math.floor(en.y);
        const squish = Math.sin(tick * 0.2) * 2;

        ctx.fillStyle = '#000000';
        ctx.fillRect(sx - 2, sy + 2 - squish, en.w + 4, en.h + squish);

        ctx.fillStyle = en.boss ? '#7b1fa2' : '#00c853';
        ctx.fillRect(sx, sy + 4 - squish, en.w, en.h - 2 + squish);
        ctx.fillStyle = en.boss ? '#ab47bc' : '#69f0ae';
        ctx.fillRect(sx + 4, sy + 2 - squish, en.w - 8, en.h - 6 + squish);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.fillRect(sx + 6, sy + 6 - squish, 6, 4);

        ctx.fillStyle = '#000000';
        const eyeOffset = en.vx > 0 ? en.w - 16 : 6;
        ctx.fillRect(sx + eyeOffset, sy + 10 - squish, 3, 4);
        ctx.fillRect(sx + eyeOffset + 7, sy + 10 - squish, 3, 4);

        if (en.boss) {
            const cx = sx + Math.floor(en.w / 2) - 10;
            const cy = sy - 10 - squish;
            ctx.fillStyle = '#ffd54f';
            ctx.fillRect(cx, cy + 4, 20, 6);
            ctx.fillRect(cx, cy, 4, 4);
            ctx.fillRect(cx + 8, cy - 2, 4, 6);
            ctx.fillRect(cx + 16, cy, 4, 4);
            ctx.fillStyle = '#e53935';
            ctx.fillRect(cx + 9, cy + 5, 2, 2);
        }

        ctx.fillStyle = '#111111';
        ctx.fillRect(sx - 1, sy - 16, en.w + 2, 6);
        ctx.fillStyle = '#e53935';
        ctx.fillRect(sx, sy - 15, Math.floor(en.w * (en.hp / en.maxHp)), 4);
    }

    function checkCollision(ent) {
        let left = Math.floor(ent.x / TILE);
        let right = Math.floor((ent.x + ent.w) / TILE);
        let top = Math.floor(ent.y / TILE);
        let bottom = Math.floor((ent.y + ent.h) / TILE);

        for (let y = top; y <= bottom; y++) {
            for (let x = left; x <= right; x++) {
                if (world[y] && world[y][x] >= 1 && world[y][x] <= 4) {
                    return true;
                }
            }
        }
        return false;
    }

    const keys = { left: false, right: false };
    window.addEventListener('keydown', e => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        if ((e.code === 'Space' || e.code === 'KeyW') && player.grounded) {
            player.vy = player.jump; player.grounded = false;
        }
    });
    window.addEventListener('keyup', e => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    });

    const bindBtn = (id, key) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); keys[key] = true; }, { passive: false });
        el.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); keys[key] = false; }, { passive: false });
        el.addEventListener('touchcancel', () => { keys[key] = false; });
        el.addEventListener('mousedown', e => { e.stopPropagation(); keys[key] = true; });
        window.addEventListener('mouseup', () => { keys[key] = false; });
    };
    bindBtn('btn-left', 'left');
    bindBtn('btn-right', 'right');

    document.getElementById('btn-jump').addEventListener('touchstart', e => {
        e.preventDefault(); e.stopPropagation();
        if (player.grounded) { player.vy = player.jump; player.grounded = false; }
    }, { passive: false });
    document.getElementById('btn-jump').addEventListener('mousedown', e => {
        e.stopPropagation();
        if (player.grounded) { player.vy = player.jump; player.grounded = false; }
    });

    document.getElementById('btn-action').addEventListener('touchstart', e => {
        e.preventDefault(); e.stopPropagation();
        performAttack();
    }, { passive: false });
    document.getElementById('btn-action').addEventListener('mousedown', e => {
        e.stopPropagation();
        performAttack();
    });

    canvas.addEventListener('pointerdown', e => {
        try {
            if (!e || !Number.isFinite(e.clientX) || !Number.isFinite(e.clientY)) return;
            const camX = Math.floor(player.x - canvas.width / 2);
            const camY = Math.floor(player.y - canvas.height / 2);
            const worldX = e.clientX + camX;
            const worldY = e.clientY + camY;

            if (Math.hypot(worldX - guide.x, worldY - guide.y) < 60 && Math.hypot(player.x - guide.x, player.y - guide.y) < 100) {
                openDialog();
                return;
            }

            if (selectedTool === 2) {
                performAttack();
                return;
            }

            const tx = Math.floor(worldX / TILE);
            const ty = Math.floor(worldY / TILE);
            const dist = Math.hypot(worldX - (player.x + player.w / 2), worldY - (player.y + player.h / 2));

            if (dist < 130 && ty >= 0 && ty < ROWS && tx >= 0 && tx < COLS && world[ty]) {
                const block = world[ty][tx];
                if (selectedTool === 0 && block > 0) {
                    if (block === 1 || block === 2) player.dirt++;
                    if (block === 4) { player.ore++; checkQuest(); }
                    world[ty][tx] = 0;
                    updateUI();
                } else if (selectedTool === 1 && block === 0 && player.dirt > 0) {
                    world[ty][tx] = 2;
                    player.dirt--;
                    if (checkCollision(player)) { world[ty][tx] = 0; player.dirt++; }
                    updateUI();
                }
            }
        } catch (_) {}
    });

    function performAttack() {
        if (player.attackCooldown > 0) return;
        player.attackCooldown = 20;
        const dmg = questStage >= 2 ? 35 : 15;

        for (let idx = enemies.length - 1; idx >= 0; idx--) {
            const en = enemies[idx];
            if (Math.hypot(en.x - player.x, en.y - player.y) < 75) {
                en.hp -= dmg;
                en.vy = -4;
                en.vx = player.facing * 4;
                if (en.hp <= 0) {
                    const isBoss = Boolean(en.boss);
                    enemies.splice(idx, 1);
                    if (isBoss) {
                        questStage = 3;
                        const qBox = document.getElementById('quest-box');
                        if (qBox) qBox.innerText = "🏆 Сюжет пройден! Вы спасли мир!";
                        setTimeout(() => {
                            if (tg && typeof tg.showAlert === 'function') {
                                try {
                                    tg.showAlert("Поздравляем! Страж повержен, вы прошли сюжетную главу!");
                                    return;
                                } catch (_) {}
                            }
                            alert("Поздравляем! Страж повержен, вы прошли сюжетную главу!");
                        }, 10);
                    }
                }
            }
        }
    }

    function selectTool(idx) {
        selectedTool = idx;
        document.querySelectorAll('.slot').forEach((s, i) => s.classList.toggle('active', i === idx));
    }

    function openDialog() {
        const title = document.getElementById('dialog-title');
        const text = document.getElementById('dialog-text');
        if (questStage === 0) {
            questStage = 1;
            document.getElementById('quest-box').innerText = "Квест: Добыть 5 руды (" + player.ore + "/5)";
        } else if (questStage === 1 && player.ore >= 5) {
            questStage = 2;
            player.ore -= 5;
            title.innerText = "🧙‍♂️ Гид (Клинок выкован!)";
            text.innerText = "Отличная работа! Я перековал руду в Рунический Меч (урон x2). Теперь отправляйся на восток и победи Короля Слизней!";
            document.getElementById('quest-box').innerText = "Квест: Победить Босса на востоке";
            updateUI();
        } else if (questStage === 2) {
            text.innerText = "Босс ждёт на правом краю острова. Выбери меч и атакуй!";
        }
        document.getElementById('dialog').style.display = 'block';
    }

    function closeDialog() {
        document.getElementById('dialog').style.display = 'none';
    }

    function checkQuest() {
        if (questStage === 1) {
            if (player.ore >= 5) {
                document.getElementById('quest-box').innerText = "Квест: Вернись к Гиду!";
            } else {
                document.getElementById('quest-box').innerText = "Квест: Добыть 5 руды (" + player.ore + "/5)";
            }
        }
    }

    function updateUI() {
        document.getElementById('hp').innerText = player.hp;
        document.getElementById('ore').innerText = player.ore;
        document.getElementById('inv-dirt').innerText = player.dirt;
    }

    function update() {
        tick++;
        if (player.attackCooldown > 0) player.attackCooldown--;

        if (keys.left) { player.vx = -player.speed; player.facing = -1; }
        else if (keys.right) { player.vx = player.speed; player.facing = 1; }
        else player.vx = 0;

        player.x += player.vx;
        if (checkCollision(player)) player.x -= player.vx;

        player.vy += GRAVITY;
        player.y += player.vy;
        player.grounded = false;
        if (checkCollision(player)) {
            if (player.vy > 0) player.grounded = true;
            player.y -= player.vy;
            player.vy = 0;
        }

        guide.facing = player.x < guide.x ? -1 : 1;
        guide.vy = (guide.vy || 0) + GRAVITY;
        guide.y += guide.vy;
        if (checkCollision(guide)) { guide.y -= guide.vy; guide.vy = 0; }

        enemies.forEach(en => {
            en.vy += GRAVITY;
            en.y += en.vy;
            if (checkCollision(en)) {
                if (en.vy > 0 && Math.random() < 0.03) en.vy = -7;
                else { en.y -= en.vy; en.vy = 0; }
            }
            en.x += en.vx;
            if (checkCollision(en)) { en.x -= en.vx; en.vx *= -1; }

            if (Math.hypot(en.x - player.x, en.y - player.y) < 30 && player.attackCooldown === 0) {
                player.hp = Math.max(0, player.hp - (en.boss ? 15 : 5));
                player.attackCooldown = 30;
                updateUI();
                if (player.hp === 0) {
                    player.hp = 100; player.x = 10 * TILE; player.y = 8 * TILE;
                    updateUI();
                }
            }
        });
    }

    function draw() {
        const camX = Math.floor(player.x - canvas.width / 2);
        const camY = Math.floor(player.y - canvas.height / 2);

        drawBackground(camX, camY);

        ctx.save();
        ctx.translate(-camX, -camY);

        const startCol = Math.max(0, Math.floor(camX / TILE) - 1);
        const endCol = Math.min(COLS - 1, Math.ceil((camX + canvas.width) / TILE) + 1);
        const startRow = Math.max(0, Math.floor(camY / TILE) - 1);
        const endRow = Math.min(ROWS - 1, Math.ceil((camY + canvas.height) / TILE) + 1);

        for (let y = startRow; y <= endRow; y++) {
            for (let x = startCol; x <= endCol; x++) {
                const type = world[y] ? world[y][x] : 0;
                if (type > 0 && tileSprites[type]) {
                    const px = x * TILE;
                    const py = y * TILE;
                    ctx.drawImage(tileSprites[type], px, py, TILE, TILE);

                    if (type <= 4) {
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                        if (y > 0 && world[y - 1][x] === 0) ctx.fillRect(px, py, TILE, 2);
                        if (y < ROWS - 1 && world[y + 1][x] === 0) ctx.fillRect(px, py + TILE - 2, TILE, 2);
                        if (x > 0 && world[y][x - 1] === 0) ctx.fillRect(px, py, 2, TILE);
                        if (x < COLS - 1 && world[y][x + 1] === 0) ctx.fillRect(px + TILE - 2, py, 2, TILE);
                    }

                    if (y > 18) {
                        const darkness = Math.min(0.65, (y - 18) * 0.035);
                        ctx.fillStyle = `rgba(10, 12, 22, ${darkness})`;
                        ctx.fillRect(px, py, TILE, TILE);
                    }
                }
            }
        }

        drawCharacter(guide, true);
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 12px monospace';
        ctx.fillText('! Гид', Math.floor(guide.x - 5), Math.floor(guide.y - 9));
        ctx.fillStyle = '#ffd54f';
        ctx.fillText('! Гид', Math.floor(guide.x - 6), Math.floor(guide.y - 10));

        drawCharacter(player, false);

        if (player.attackCooldown > 10) {
            const isUpgraded = questStage >= 2;
            const sx = player.facing === 1 ? Math.floor(player.x + player.w) : Math.floor(player.x - 32);
            const sy = Math.floor(player.y + 8);
            ctx.fillStyle = isUpgraded ? 'rgba(0, 229, 255, 0.35)' : 'rgba(255, 255, 255, 0.35)';
            ctx.fillRect(sx, sy - 4, 32, 20);
            ctx.fillStyle = isUpgraded ? '#00e5ff' : '#ffffff';
            ctx.fillRect(sx, sy + 4, 32, 4);
        }

        enemies.forEach(en => drawSlime(en));

        ctx.restore();
    }

    function loop() {
        try {
            update();
            draw();
        } catch (err) {
            const box = document.getElementById('err-box');
            if (box) {
                box.style.display = 'block';
                box.textContent = 'Ошибка кадра: ' + (err && err.message ? err.message : err);
            }
            return;
        }
        requestAnimationFrame(loop);
    }

    initTextures();
    generateWorld();
    loop();
</script>
</body>
</html>
